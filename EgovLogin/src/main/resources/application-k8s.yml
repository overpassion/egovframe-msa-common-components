# Kubernetes 프로파일(SPRING_PROFILES_ACTIVE=k8s)
# - Config Server·Eureka 없이 기동한다. datasource.*·token.*·roles.* 등은 ConfigMap·Secret 환경 변수로 받는다.
# - Redis 접속 정보는 SPRING_DATA_REDIS_HOST/PORT/PASSWORD 환경 변수(redis-secret)로 덮어쓴다.
# - 비루트 실행을 위해 서비스 포트 8080, 프로브는 관리 포트 8081을 쓴다. 관리 포트에는 Spring Security 체인이
#   함께 적용되므로 /actuator/** 를 인증 제외 경로에 추가한다(게이트웨이 서명 필터는 관리 포트를 타지 않는다).
server:
  port: 8080

spring:
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis.egov-db.svc.cluster.local}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

management:
  server:
    port: 8081
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  level:
    org:
      egovframe:
        rte: info
      springframework:
        boot:
          autoconfigure: error
        web: info
    egovframework:
      com: info

org:
  egovframe:
    crypto:
      algorithm: SHA-256
      algorithmKey: ${EGOV_CRYPTO_ALGORITHM_KEY:egovframe}
      algorithmKeyHash: ${EGOV_CRYPTO_ALGORITHM_KEY_HASH:gdyYs/IZqY86VcWhT8emCYfqY1ahw2vtLG+/FzNqtrQ=}
    security:
      permitAllList: /css/**, /img/**, /js/**, /uat/**, /actuator/**
