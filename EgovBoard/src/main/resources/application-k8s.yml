# Kubernetes 프로파일(SPRING_PROFILES_ACTIVE=k8s)
# - Config Server·Eureka 없이 기동한다. datasource.*·token.*·file.*·spring.rabbitmq.* 등은 ConfigMap·Secret 환경 변수로 받는다.
# - 비루트 실행을 위해 서비스 포트 8080, 프로브는 관리 포트 8081을 쓴다(관리 포트는 게이트웨이 서명 필터를 타지 않는다).
server:
  port: 8080

spring:
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

management:
  server:
    port: 8081
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health, info
  health:
    rabbit:
      enabled: false

logging:
  level:
    org:
      egovframe:
        rte: info
      springframework:
        boot:
          autoconfigure: error
        web: info
    egovframework:
      com: info

org:
  egovframe:
    crypto:
      algorithm: SHA-256
      algorithmKey: ${EGOV_CRYPTO_ALGORITHM_KEY:egovframe}
      algorithmKeyHash: ${EGOV_CRYPTO_ALGORITHM_KEY_HASH:gdyYs/IZqY86VcWhT8emCYfqY1ahw2vtLG+/FzNqtrQ=}
