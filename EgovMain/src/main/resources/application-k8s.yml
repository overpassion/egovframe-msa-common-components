# Kubernetes 프로파일(SPRING_PROFILES_ACTIVE=k8s)
# - Config Server·Eureka 없이 기동한다. EgovMain은 DB·토큰 설정을 쓰지 않는다.
# - 비루트 실행을 위해 서비스 포트 8080, 프로브는 관리 포트 8081을 쓴다.
server:
  port: 8080

spring:
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

management:
  server:
    port: 8081
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  level:
    org:
      egovframe:
        rte: info
      springframework:
        boot:
          autoconfigure: error
        web: info
    egovframework:
      com: info
